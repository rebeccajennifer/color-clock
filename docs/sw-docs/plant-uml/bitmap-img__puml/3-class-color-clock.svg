xt fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="126.4307" x="372.5" y="42.292">Composition  -&#9670;</text><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="252.8613" x="525.7881" y="42.292">I own you and you die with me.</text><line style="stroke:#181818;stroke-width:1;" x1="367.5" x2="808.9355" y1="47.5938" y2="47.5938"/><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="126.4307" x="372.5" y="62.5889">Aggregation  -&#9671;</text><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="244.4326" x="525.7881" y="62.5889">I have you but you can leave.</text><line style="stroke:#181818;stroke-width:1;" x1="367.5" x2="808.9355" y1="67.8906" y2="67.8906"/><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="118.002" x="372.5" y="82.8857">Association  -</text><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="278.1475" x="525.7881" y="82.8857">I talk to you as a peer / global.</text><line style="stroke:#181818;stroke-width:1;" x1="367.5" x2="808.9355" y1="88.1875" y2="88.1875"/><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="134.8594" x="372.5" y="103.1826">Dependency   --&gt;</text><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="202.2891" x="525.7881" y="103.1826">I use your static logic.</text></g><!--link ColorClock to TimeCalcs--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="26" id="lnk5"><path codeLine="26" d="M160.75,72.15 C160.75,104.06 160.75,177 160.75,177 C160.75,177 156.73,177 143.43,177" fill="none" id="ColorClock-to-TimeCalcs" style="stroke:#4E4E4E;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#4E4E4E" points="137.43,1