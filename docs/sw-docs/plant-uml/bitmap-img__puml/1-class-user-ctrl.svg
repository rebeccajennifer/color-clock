<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="206px" preserveAspectRatio="none" style="width:743px;height:206px;background:#FFFFFF;" version="1.1" viewBox="0 0 743 206" width="743px" zoomAndPan="magnify"><defs/><g><g class="entity" data-qualified-name="uml_legend" data-source-line="2" id="ent0002"><rect fill="#F1F1F1" height="101.4844" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="441.4355" x="7" y="7"/><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="202.2891" x="126.5732" y="21.9951">UML Relationships Legend</text><line style="stroke:#181818;stroke-width:1;" x1="160.2881" x2="160.2881" y1="27.2969" y2="108.4844"/><line style="stroke:#181818;stroke-width:1;" x1="7" x2="448.4355" y1="27.2969" y2="27.2969"/><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="126.4307" x="12" y="42.292">Composition  -&#9670;</text><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="252.8613" x="165.2881" y="42.292">I own you and you die with me.</text><line style="stroke:#181818;stroke-width:1;" x1="7" x2="448.4355" y1="47.5938" y2="47.5938"/><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="126.4307" x="12" y="62.5889">Aggregation  -&#9671;</text><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="244.4326" x="165.2881" y="62.5889">I have you but you can leave.</text><line style="stroke:#181818;stroke-width:1;" x1="7" x2="448.4355" y1="67.8906" y2="67.8906"/><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="118.002" x="12" y="82.8857">Association  -</text><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="278.1475" x="165.2881" y="82.8857">I talk to you as a peer / global.</text><line style="stroke:#181818;stroke-width:1;" x1="7" x2="448.4355" y1="88.1875" y2="88.1875"/><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="134.8594" x="12" y="103.1826">Dependency   --&gt;</text><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="202.2891" x="165.2881" y="103.1826">I use your static logic.</text></g><!--class UserCtrl--><g class="entity" data-qualified-name="UserCtrl" data-source-line="21" id="ent0003"><rect fill="#E4E4E4" height="28.625" rx="2.5" ry="2.5" style="stroke:#874787;stroke-width:4;" width="175" x="491" y="43"/><text fill="#262626" font-family="'Monospaced'" font-size="16" lengthAdjust="spacing" textLength="77.0625" x="539.9688" y="62.8516">UserCtrl</text></g><!--class ColorClock--><g class="entity" data-qualified-name="ColorClock" data-source-line="22" id="ent0004"><rect fill="#E4E4E4" height="28.625" rx="2.5" ry="2.5" style="stroke:#874787;stroke-width:4;" width="175" x="397" y="172"/><text fill="#262626" font-family="'Monospaced'" font-size="16" lengthAdjust="spacing" textLength="96.3281" x="436.3359" y="191.8516">ColorClock</text></g><!--class Button--><g class="entity" data-qualified-name="Button" data-source-line="25" id="ent0005"><rect fill="#E4E4E4" height="26.2969" rx="2.5" ry="2.5" style="stroke:#475F87;stroke-width:2;" width="130" x="607.5" y="173.5"/><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="50.5723" x="647.2139" y="191.4951">Button</text></g><!--reverse link UserCtrl to Button--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="composition" data-source-line="25" id="lnk6"><path codeLine="25" d="M636.75,84.3 C636.75,109.71 636.75,149.24 636.75,173.42" fill="none" id="UserCtrl-backto-Button" style="stroke:#4E4E4E;stroke-width:1;"/><polygon fill="#4E4E4E" points="636.75,72.3,632.75,78.3,636.