292">Composition  -&#9670;</text><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="252.8613" x="1196.2881" y="42.292">I own you and you die with me.</text><line style="stroke:#181818;stroke-width:1;" x1="1038" x2="1479.4355" y1="47.5938" y2="47.5938"/><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="126.4307" x="1043" y="62.5889">Aggregation  -&#9671;</text><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="244.4326" x="1196.2881" y="62.5889">I have you but you can leave.</text><line style="stroke:#181818;stroke-width:1;" x1="1038" x2="1479.4355" y1="67.8906" y2="67.8906"/><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="118.002" x="1043" y="82.8857">Association  -</text><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="278.1475" x="1196.2881" y="82.8857">I talk to you as a peer / global.</text><line style="stroke:#181818;stroke-width:1;" x1="1038" x2="1479.4355" y1="88.1875" y2="88.1875"/><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="134.8594" x="1043" y="103.1826">Dependency   --&gt;</text><text fill="#262626" font-family="'Monospaced'" font-size="14" lengthAdjust="spacing" textLength="202.2891" x="1196.2881" y="103.1826">I use your static logic.</text></g><!--reverse link TopLevel to TimeController--><g class="link" data-entity-1="ent0006" data-entity-2="ent0008" data-link-type="composition" data-source-line="40" id="lnk19"><path codeLine="40" d="M382.5,84.3 C382.5,109.18 382.5,147.11 382.5,171.87" fill="none" id="TopLevel-backto-TimeController" style="stroke:#4E4E4E;stroke-width:1;"/><polygon fill="#4E4E4E" points="382.5,72.3,378.5,78.3,382.5,84.3,386.5,78.3,382.5,72.3" style="stroke:#4E4E4E;stroke-width:1;"/></g><!--reverse link TopLevel to UserCtrl--><g class="link" data-e